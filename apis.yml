name: Tahoe
description: >-
  Tahoe (Tahoe Therapeutics) is a San Francisco AI-biotech company building "the ground
  truth for biological superintelligence." It generates gigascale perturbative single-cell
  datasets and trains foundation models of the human cell to design therapeutics, starting
  with cancer. Flagship open assets include Tahoe-100M — the largest interventional
  single-cell dataset to date (100M+ transcriptomes across ~1,100 chemical perturbations
  and 50 cancer cell lines) — and Tahoe-x1, a family of perturbation-trained single-cell
  foundation models with up to 3 billion parameters, released fully open-source with open
  weights plus training and evaluation code. Tahoe's Mosaic platform makes in vivo,
  single-cell-resolution data generation scalable. Backed by General Catalyst and Wing
  Venture Capital, Tahoe publishes no commercial REST API; its programmatic surface is
  open-source models, datasets, and the first-party tahoe-x1 Python library.
